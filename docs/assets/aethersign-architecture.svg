<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">AetherSign on-device pipeline</title>
  <desc id="desc">A minimal six-step visual pipeline from image capture to on-screen gloss output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101f"/>
      <stop offset="1" stop-color="#111335"/>
    </linearGradient>
    <linearGradient id="flow" x1="80" y1="0" x2="1360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset=".62" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l9 5-9 5z" fill="#64748b"/></marker>
  </defs>

  <rect width="1440" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="40" cy="540" r="280" fill="#0891b2" opacity=".07"/>
  <circle cx="1390" cy="15" r="300" fill="#4338ca" opacity=".08"/>

  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="64" y="68" fill="#94a3b8" font-size="17" font-weight="700" letter-spacing="4">SIGN  →  SKELETON  →  GLOSS</text>
    <text x="64" y="106" fill="#f8fafc" font-size="29" font-weight="720">ON-DEVICE PIPELINE</text>

    <!-- Flow rail -->
    <path d="M167 263H1268" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M227 263h89"/><path d="M452 263h89"/><path d="M677 263h89"/><path d="M902 263h89"/><path d="M1127 263h89"/>
    </g>

    <!-- Node 1: camera -->
    <g transform="translate(162 263)">
      <circle r="66" fill="#082f49" stroke="#22d3ee" stroke-width="3"/>
      <circle r="28" fill="none" stroke="#a5f3fc" stroke-width="5"/>
      <circle r="9" fill="#67e8f9"/>
      <path d="M-41-27h18l9-12h28l9 12h18" fill="none" stroke="#a5f3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Node 2: palm box -->
    <g transform="translate(387 263)">
      <circle r="66" fill="#21154a" stroke="#8b5cf6" stroke-width="3"/>
      <rect x="-37" y="-37" width="74" height="74" rx="10" fill="none" stroke="#c4b5fd" stroke-width="4"/>
      <path d="M-17 17V-14M0 9V-28M17 14V-17M-20 4l-17-15" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/>
      <path d="M-22 8c6-13 23-17 35-8l14 10c8 6 10 17 5 26l-8 14h-34l-11-22c-3-7-4-14-1-20z" fill="#2e1b62" stroke="#c4b5fd" stroke-width="3"/>
    </g>

    <!-- Node 3: landmarks -->
    <g transform="translate(612 263)">
      <circle r="66" fill="#21154a" stroke="#8b5cf6" stroke-width="3"/>
      <g fill="#ddd6fe"><circle cx="-30" cy="22" r="6"/><circle cx="-22" cy="-2" r="6"/><circle cx="-10" cy="-28" r="6"/><circle cx="3" cy="0" r="6"/><circle cx="21" cy="-22" r="6"/><circle cx="28" cy="14" r="6"/><circle cx="12" cy="36" r="6"/></g>
      <path d="M-30 22l8-24 12-26L3 0l18-22 7 36-16 22L3 0-22-2M28 14L3 0" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Node 4: temporal window -->
    <g transform="translate(837 263)">
      <circle r="66" fill="#10234e" stroke="#3b82f6" stroke-width="3"/>
      <rect x="-34" y="-31" width="58" height="66" rx="8" fill="#142b5c" stroke="#bfdbfe" stroke-width="4"/>
      <rect x="-20" y="-20" width="58" height="66" rx="8" fill="#10234e" stroke="#60a5fa" stroke-width="4"/>
      <path d="M-4-1h25M-4 12h25M-4 25h17" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Node 5: gloss -->
    <g transform="translate(1062 263)">
      <circle r="66" fill="#21154a" stroke="#8b5cf6" stroke-width="3"/>
      <path d="M-38 19c22-52 54-52 76 0M-27-8c17 21 37 21 54 0" fill="none" stroke="#ddd6fe" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-27" cy="-18" r="7" fill="#c4b5fd"/><circle cx="27" cy="-18" r="7" fill="#c4b5fd"/>
      <path d="M-15 35h30" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Node 6: display -->
    <g transform="translate(1287 263)">
      <circle r="66" fill="#052e2b" stroke="#10b981" stroke-width="3"/>
      <rect x="-39" y="-32" width="78" height="56" rx="7" fill="none" stroke="#a7f3d0" stroke-width="5"/>
      <path d="M-19 38h38M0 24v14" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round"/>
      <path d="M-20-6l10 10 22-24" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Minimal labels -->
    <g text-anchor="middle">
      <g transform="translate(162 0)"><text y="376" fill="#f8fafc" font-size="20" font-weight="700">CAPTURE</text><text y="405" fill="#67e8f9" font-size="15">SC132GS · 90 FPS</text></g>
      <g transform="translate(387 0)"><text y="376" fill="#f8fafc" font-size="20" font-weight="700">PALM</text><text y="405" fill="#c4b5fd" font-size="15">Eos</text></g>
      <g transform="translate(612 0)"><text y="376" fill="#f8fafc" font-size="20" font-weight="700">21 POINTS</text><text y="405" fill="#c4b5fd" font-size="15">Iris</text></g>
      <g transform="translate(837 0)"><text y="376" fill="#f8fafc" font-size="20" font-weight="700">64 FRAMES</text><text y="405" fill="#93c5fd" font-size="15">Temporal Window</text></g>
      <g transform="translate(1062 0)"><text y="376" fill="#f8fafc" font-size="20" font-weight="700">GLOSS</text><text y="405" fill="#c4b5fd" font-size="15">Muse</text></g>
      <g transform="translate(1287 0)"><text y="376" fill="#f8fafc" font-size="20" font-weight="700">OUTPUT</text><text y="405" fill="#6ee7b7" font-size="15">OSD</text></g>
    </g>

    <g font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">
      <g transform="translate(111 470)"><rect width="102" height="31" rx="15.5" fill="#083344"/><text x="51" y="21" fill="#a5f3fc">SENSOR</text></g>
      <g transform="translate(310 470)"><rect width="829" height="31" rx="15.5" fill="#2e1065"/><text x="414.5" y="21" fill="#ddd6fe">FLYINGCHIP A1 · NPU / MEMORY</text></g>
      <g transform="translate(1230 470)"><rect width="114" height="31" rx="15.5" fill="#052e2b"/><text x="57" y="21" fill="#a7f3d0">DISPLAY</text></g>
    </g>
  </g>
</svg>
