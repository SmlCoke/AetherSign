<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">AetherSign project hero</title>
  <desc id="desc">A minimal technology banner with the AetherSign hand mark, project name, tagline, and four platform attributes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050816"/>
      <stop offset="0.58" stop-color="#0a1530"/>
      <stop offset="1" stop-color="#11113a"/>
    </linearGradient>
    <linearGradient id="brand" x1="80" y1="58" x2="410" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="1" r="1.3">
      <stop stop-color="#e0f2fe" stop-opacity=".66"/>
      <stop offset=".28" stop-color="#2563eb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="88" cy="438" r="370" fill="url(#aura)"/>
  <path d="M0 361C230 276 388 419 620 360S1076 285 1440 346V420H0Z" fill="#4338ca" fill-opacity=".1"/>

  <!-- Minimal AetherSign mark -->
  <g transform="translate(84 24) scale(.72)">
    <circle cx="256" cy="256" r="207" fill="#09142c" fill-opacity=".5" stroke="url(#brand)" stroke-opacity=".34" stroke-width="8"/>
    <path d="M84 270A174 174 0 0 1 365 119" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 22"/>
    <path d="M413 330A174 174 0 0 1 156 405" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 22"/>
    <g fill="url(#brand)">
      <circle cx="165" cy="176" r="16"/><circle cx="210" cy="132" r="16"/><circle cx="260" cy="114" r="16"/><circle cx="311" cy="130" r="16"/><circle cx="355" cy="171" r="16"/>
      <path d="M162 286L109 238C97 227 96 208 107 196C118 184 137 183 149 194L193 235Z"/>
      <rect x="213" y="392" width="25" height="76" rx="12.5"/><rect x="286" y="392" width="25" height="76" rx="12.5"/>
    </g>
    <path d="M171 263C179 232 211 214 242 225L334 258C364 269 380 302 370 332L346 405C337 432 312 450 284 450H226C196 450 169 431 159 403L132 329C121 299 138 269 171 263Z" fill="#0b1533" stroke="url(#brand)" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="950" y="100" fill="#a5b4fc" font-size="29" font-weight="720" letter-spacing="1">AetherSign</text>

    <text x="950" y="185" fill="#f8fafc" font-size="57" font-weight="650" letter-spacing="-.8">Where motion</text>
    <text x="950" y="251" fill="#f8fafc" font-size="57" font-weight="650" letter-spacing="-.8">finds its voice.</text>

    <rect x="600" y="292" width="700" height="1.5" rx="1" fill="url(#brand)" opacity=".65"/>
    <text x="950" y="344" fill="#cbd5e1" font-size="18" font-weight="600">
      <tspan>Flyingchip A1</tspan>
      <tspan fill="#22d3ee">　·　</tspan>
      <tspan>0.8 TOPS</tspan>
      <tspan fill="#818cf8">　·　</tspan>
      <tspan>IR Vision</tspan>
      <tspan fill="#c084fc">　·　</tspan>
      <tspan>Global Shutter</tspan>
    </text>
  </g>
</svg>
